name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a 'Run workflow' button on the Actions tab, so a pipeline can be
  # started by hand without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Byte-compiling every module catches syntax errors and bad indentation
      # across the whole backend in one pass.
      - name: Byte-compile the backend
        run: python -m compileall -q backend

      # A syntax-clean module can still fail at import time on a missing
      # dependency or a bad import name, so import the app and its siblings.
      - name: Import every backend module
        run: |
          set -euo pipefail
          cd backend
          for module in app auth config db extract ingest nvidia_client research store tg_notify tgbot; do
            echo "importing $module"
            python -c "import $module"
          done