<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocChat</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/style.css?v=7">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark"><img src="/icon.png" alt=""></span>
      <div>
        <h1>DocChat</h1>
        <p id="status" class="status">checking services…</p>
      </div>
    </div>

    <div class="usermenu">
      <button type="button" class="userbtn" id="userbtn" aria-haspopup="true" aria-expanded="false">
        <span class="avatar" id="avatar">?</span>
        <span class="uname">
          <strong id="uname">…</strong>
          <em id="urole"></em>
        </span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="dropdown" id="userdrop" hidden>
        <a class="item" href="/admin" id="adminlink">Admin panel</a>
        <button class="item" type="button" id="changepw">Change password</button>
        <button class="item danger" type="button" id="logout">Sign out</button>
      </div>
    </div>

    <section class="panel">
      <h2>Add documents</h2>
      <div id="drop" class="drop">
        <input type="file" id="file" multiple hidden>
        <p><strong>Drop files here</strong></p>
        <p class="hint">or <button type="button" class="link" id="browse">browse</button></p>
        <p class="hint">PDF · TXT · MD · DOCX · HTML · PNG · JPG</p>
      </div>
      <div class="url-row">
        <input type="url" id="url" placeholder="or paste a URL to fetch…">
        <button type="button" id="url-go" class="ghost">Add</button>
      </div>
      <div id="jobs" class="jobs"></div>
    </section>

    <section class="panel chats">
      <h2>Chats
        <button type="button" class="mini" id="newchat" title="Start a new chat">+ New</button>
      </h2>
      <div id="chats" class="chatlist"></div>
    </section>

    <section class="panel grow">
      <h2>Library <span id="count" class="count">0</span></h2>
      <div id="sources" class="sources"></div>
    </section>
  </aside>

  <main class="main">
    <header class="toolbar">
      <div class="modes" role="tablist">
        <button type="button" class="mode active" data-mode="text" role="tab">Ask documents</button>
        <button type="button" class="mode" data-mode="visual" role="tab">Find images</button>
      </div>
      <select id="scope" class="scope">
        <option value="">All documents</option>
      </select>
      <div class="spacer"></div>
      <div class="sourcemodes" role="radiogroup" aria-label="Where answers come from">
        <button type="button" class="srcmode active" data-src="strict" role="radio"
                aria-checked="true" title="Answer only from your documents">
          Documents
        </button>
        <button type="button" class="srcmode" data-src="blend" role="radio"
                aria-checked="false" title="Your documents first, then general knowledge">
          + Knowledge
        </button>
        <button type="button" class="srcmode" data-src="research" role="radio"
                aria-checked="false" title="Your documents plus a live web search">
          Research
        </button>
      </div>
    </header>

    <div id="thread" class="thread">
      <div class="empty" id="empty">
        <h3>Ask about your library</h3>
        <p>Upload documents, images or a URL on the left, then ask a question. Answers cite the source passage they came from.</p>
      </div>
    </div>

    <form id="composer" class="composer">
      <textarea id="question" rows="1" placeholder="Ask a question about your documents…"></textarea>
      <button type="submit" id="send" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/app.js?v=7"></script>

<div class="modal" id="pwmodal" hidden>
  <div class="modal-card">
    <h3>Change password</h3>
    <label for="pw-cur">Current password</label>
    <input id="pw-cur" type="password" autocomplete="current-password">
    <label for="pw-new">New password</label>
    <input id="pw-new" type="password" autocomplete="new-password" placeholder="minimum 8 characters">
    <label for="pw-new2">Confirm new password</label>
    <input id="pw-new2" type="password" autocomplete="new-password">
    <p class="modal-err" id="pw-err" hidden></p>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="pw-cancel">Cancel</button>
      <button class="btn" type="button" id="pw-save">Update password</button>
    </div>
  </div>
</div>
<script src="/session.js?v=1"></script>
</body>
</html>
